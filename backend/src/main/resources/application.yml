spring:
  application:
    name: ebookstore-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ebookstore}
    username: ${DB_USERNAME:ebookstore}
    password: ${DB_PASSWORD}   # required - set as an environment variable, never commit it
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # schema is owned by Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 127.0.0.1           # bind to localhost only
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
