# =====================================================================
# EBookStore backend configuration (BASE = production-safe settings).
#
# Rules:
#  * NO secrets in this file. Secrets come from environment variables (${NAME}).
#  * ${NAME:default} means "use env var NAME, or the default if it is not set".
#    Properties WITHOUT a default (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET) make the app
#    refuse to start when the variable is missing - this is intentional (fail fast).
#  * Profiles add or override settings:
#      application-dev.properties   local development (opt-in: SPRING_PROFILES_ACTIVE=dev)
#      application-prod.properties  production hardening (SPRING_PROFILES_ACTIVE=prod)
#  * See .env.example and docs/DATABASE_SETUP.md for the list of variables.
# =====================================================================

spring.application.name=ebookstore-backend

# ---------- Web server ----------
# Listen on localhost only (never on all network interfaces).
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
# Reject JSON with fields the contract does not define (for example a "role" in a registration request).
spring.jackson.deserialization.fail-on-unknown-properties=true
# Never put exception messages or stack traces in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------- Database (PostgreSQL) ----------
# All three values come from environment variables, e.g.
#   DB_URL=jdbc:postgresql://localhost:5432/ebookstore_db
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.pool-name=ebookstore-pool
# Never wait forever for a database connection (milliseconds).
spring.datasource.hikari.connection-timeout=10000
# Do not hold a connection open while rendering the HTTP response.
spring.jpa.open-in-view=false
# Flyway owns the schema. Hibernate only CHECKS that entities match the tables and fails at
# startup when they differ. It never creates or alters tables (never use update/create here).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Flyway creates and versions the schema: db/migration/V1__..., V2__... (never edit an applied file).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# Flyway "clean" drops everything; keep it switched off in every profile.
spring.flyway.clean-disabled=true

# ---------- Security: JWT ----------
# Secret used to sign tokens (HS256). Must be at least 32 characters. Generate one with:
#   PowerShell: [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Maximum 256 }) -as [byte[]])
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}
app.security.jwt.issuer=ebookstore

# ---------- CORS: which browser origin may call the API ----------
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ---------- Business rules (from the approved openapi.yaml) ----------
app.business.max-quantity-per-line=10
app.business.max-addresses-per-user=10
app.business.point-value=1.00
app.business.max-redeem-percent-of-subtotal=50
app.business.earn-amount-per-point=10.00
app.business.cancellation-window-hours=48
app.business.unpaid-order-cancel-minutes=30
app.business.idempotency-key-ttl-hours=24
app.business.delivery-days=5
app.business.remote-area-extra-days=2

# ---------- API documentation ----------
# Swagger UI shows the APPROVED contract (openapi.yaml), not a spec generated from the code.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
