# =====================================================================
# DEVELOPMENT profile - local PostgreSQL on your own computer.
# Activate with:  $env:SPRING_PROFILES_ACTIVE = "dev"
#
# Only NON-secret convenience defaults live here. The password (DB_PASSWORD) and JWT_SECRET
# still have to come from environment variables.
# =====================================================================

# Defaults for a local database; set DB_URL / DB_USERNAME to override them.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebookstore_db}
spring.datasource.username=${DB_USERNAME:ebookstore_user}

# More detail in the log while developing (no SQL parameters, so no personal data).
logging.level.com.example.ebookstore=DEBUG
logging.level.org.flywaydb=INFO
