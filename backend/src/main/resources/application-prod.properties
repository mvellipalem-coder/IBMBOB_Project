# =====================================================================
# PRODUCTION profile - hardening on top of the (already safe) base settings.
# Activate with:  SPRING_PROFILES_ACTIVE=prod
#
# Nothing here has a default value: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET and
# CORS_ALLOWED_ORIGIN must all be provided by the environment or a secrets manager.
# The server still binds to 127.0.0.1; put a TLS-terminating reverse proxy in front of it.
# Use TLS to the database, for example:
#   DB_URL=jdbc:postgresql://<db-host>:5432/ebookstore_db?sslmode=verify-full
# =====================================================================

# No default origin in production: it must be set explicitly.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Interactive API documentation is not exposed in production.
springdoc.swagger-ui.enabled=false

# Keep the log quiet and machine-readable (JSON, Elastic Common Schema).
logging.level.root=WARN
logging.level.com.example.ebookstore=INFO
logging.structured.format.console=ecs

spring.datasource.hikari.maximum-pool-size=10
